name: Build and Test

on:
  workflow_call:

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true
      - name: Build
        run: |
          pnpm install
          pnpm -r run build
      - name: Test
        run: |
          pnpm -r run test
